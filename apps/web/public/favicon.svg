<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Mindforge">
  <title>Mindforge</title>
  <!--
    The mark: an anvil, the temper run laid across its face, a spark struck off the heel.

    Drawn on a 32 x 32 grid so the slab's edges land on whole pixels at 16 and 32;
    only the horn, the waist and the spark go off-axis. This file is the source every
    raster icon is generated from — see scripts/generate-icons.mjs. Edit the three
    paths here, run `pnpm icons`, and the .ico and .png set follows.

    Colours are literal rather than the mf-band-* custom properties because a favicon
    renders in browser chrome, outside the document, where the token sheet does not
    exist. They are copied from src/styles/tokens.css and must be changed with it. The
    in-app mark (src/app/Logo.tsx) reads the tokens directly and is the one that matters
    for the no-raw-colour rule.

    Note the custom properties are named *without* their leading double hyphen above,
    and must stay that way. This is an XML document: a comment containing "- -" (closed
    up) is a parse error, not a lint warning, and the whole file fails to render. It
    reached main written the other way and every browser silently fell back to
    favicon.ico for it — generate-icons.mjs could not catch that, because it inlines
    this file into an HTML page, and HTML's comment parsing is lenient where the
    standalone SVG document a browser tab requests is not.
  -->
  <style>
    /*
      The tab strip follows the browser's theme, not the app's. tokens.css makes dark
      opt-in via the toggle by product decision, but that decision governs the
      document — it has no say over the chrome this icon sits in, so here OS
      preference is the right signal.
    */
    .steel { fill: #161d22 }
    @media (prefers-color-scheme: dark) { .steel { fill: #c9d2d8 } }
  </style>
  <defs>
    <!--
      The temper run, coolest band at the horn heating toward the heel where the
      spark just came off. It stops at x=26 and pads, so the heel under the spark is
      solid ember. Straw (#c89a34) is omitted on purpose: sitting between bronze and
      ember it is a light value in a dark neighbourhood, and at 16px it reads as a
      hole punched through the face. The four remaining stops keep the scale's
      direction, which is the part the ordering encodes.
    -->
    <linearGradient id="mf-run" gradientUnits="userSpaceOnUse" x1="4" y1="15" x2="26" y2="15">
      <stop offset="0" stop-color="#5b87a6" />
      <stop offset=".28" stop-color="#455d8a" />
      <stop offset=".55" stop-color="#7c4e66" />
      <stop offset=".8" stop-color="#b06a33" />
      <stop offset="1" stop-color="#c2582f" />
    </linearGradient>
  </defs>
  <path fill="#c2582f" d="M24 1.5l1.6 2.9 2.9 1.6-2.9 1.6-1.6 2.9-1.6-2.9L19.5 6l2.9-1.6z" />
  <path fill="url(#mf-run)" d="M2 15l4-3h24v6H8z" />
  <path class="steel" d="M25 18l-2 4 5 3v3H8v-3l5-3-2-4z" />
</svg>

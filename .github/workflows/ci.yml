name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The lessons service runs on Bun — pure I/O, no Prisma, no Nest.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: pnpm install --frozen-lockfile

      # The generated Prisma client is not committed, and lint/typecheck cannot
      # resolve types without it.
      - name: Generate Prisma client
        run: pnpm --filter @mindforge/db generate

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The 80% floor lives here, not in pre-commit. A gate that makes commits
      # slow becomes a gate everyone bypasses. See TECH-DESIGN.md §13.3.
      - name: Test with coverage gate
        run: pnpm test:coverage

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The lessons service runs on Bun — pure I/O, no Prisma, no Nest.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: pnpm install --frozen-lockfile

      # The generated Prisma client is not committed, and lint/typecheck cannot
      # resolve types without it.
      - name: Generate Prisma client
        run: pnpm --filter @mindforge/db generate

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # The boundary rules once loaded cleanly and enforced nothing, so their
      # absence of errors proves nothing on its own. This asserts they still fire.
      - name: Verify architectural boundaries
        run: pnpm check:boundaries

      # FR-L7: a missing translation key fails the build rather than rendering a raw
      # key to the user.
      - name: Verify translation bundles
        run: pnpm check:i18n

      - name: Typecheck
        run: pnpm typecheck

      # The 80% floor lives here, not in pre-commit. A gate that makes commits
      # slow becomes a gate everyone bypasses. See TECH-DESIGN.md §13.3.
      - name: Test with coverage gate
        run: pnpm test:coverage

  # Integration and RLS, against the real stack.
  #
  # A separate job because it needs Docker and takes minutes, and because a lint failure
  # should not wait for a database to boot to report itself.
  #
  # This has to be the **whole local Supabase stack**, not just Postgres. The suite signs
  # users up through GoTrue so the tokens it uses are real ES256 tokens verified against
  # Supabase's published JWKS — a hand-minted JWT would prove nothing about the guard, which
  # is the single thing standing between a request and another user's rows. And the RLS
  # tests need the `authenticated` role and its grants, which come from the same stack.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: pnpm install --frozen-lockfile

      # `--exclude` trims the containers this suite never touches — Realtime, Storage, the Studio
      # UI, Edge Functions, and the log pipeline are several minutes of image pulls for nothing.
      #
      # `db` and `kong` are not excludable here: Postgres is the point, and GoTrue sits behind the
      # Kong gateway that `API_URL` addresses. The names come from `supabase start --help`, which is
      # the only authority on them — an invalid one is a hard failure rather than a silent no-op.
      # `storage` is no longer excluded. M3 keeps teach workspaces in it (§7.2), and the bucket's
      # access control is "a private bucket with no policies denies everyone but the service role" —
      # a claim about somebody else's schema that is only worth making if something checks it.
      # packages/db/test/workspace-bucket.test.ts does, over HTTP, which needs the service running.
      - name: Start Supabase
        run: |
          supabase start \
            --exclude realtime,imgproxy,studio,edge-runtime,functions,vector,analytics,inbucket

      # `supabase status -o env` emits the local keys and URLs under the CLI's own names; the apps
      # read different ones. Mapped explicitly rather than sourced wholesale, so a rename in the CLI
      # fails here instead of leaving a variable empty and surfacing as an auth error thirty lines on.
      #
      # The grep is load-bearing: that command also prints "Stopped services: [...]" and a
      # version-update notice, and `eval`ing either is a shell syntax error.
      - name: Export connection settings
        run: |
          eval "$(supabase status -o env | grep -E '^[A-Z0-9_]+=' | sed 's/^/export /')"
          test -n "$API_URL" && test -n "$ANON_KEY" && test -n "$DB_URL"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            # Storage denials are asserted with a minted `authenticated` token rather than the anon
            # key, because anon and authenticated are different roles and a policy can grant one
            # without the other. Signing one needs the secret.
            echo "SUPABASE_JWT_SECRET=$JWT_SECRET"
            # A placeholder, and correctly so: non-negotiable 8 forbids live API
            # calls in the suites, and the worker requires the key at boot rather
            # than discovering it missing ten minutes into an agent run.
            echo "ANTHROPIC_API_KEY=ci-placeholder-no-live-calls"
            echo "DATABASE_URL=$DB_URL"
            echo "DIRECT_URL=$DB_URL"
            echo "APP_ORIGIN=http://localhost:5173"
            echo "API_ORIGIN=http://localhost:3000"
            # Only `VITE_*` reaches the browser bundle, which is the guardrail keeping the
            # service-role key out of it — so the web app needs its own copies under those names.
            echo "VITE_API_ORIGIN=http://localhost:3000"
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
          } >> "$GITHUB_ENV"

      - name: Generate Prisma client
        run: pnpm --filter @mindforge/db generate

      # `migrate deploy`, not `db push`: the migrations carry the RLS policies and the
      # Supabase role grants, and a schema pushed from `schema.prisma` would have neither —
      # so every RLS test would pass for the wrong reason.
      - name: Apply migrations
        run: pnpm --filter @mindforge/db exec prisma migrate deploy

      - name: RLS suite
        run: pnpm --filter @mindforge/db exec vitest run

      # `test:integration:coverage`, not `test:integration`. The thresholds this suite declares for
      # `infrastructure/` and `presentation/` — the layers the unit config deliberately excludes, on
      # the grounds that they are gated here — were not enforced by anything: CI ran the variant
      # without `--coverage`, so both layers were ungated in practice while two configs each pointed
      # at the other.
      - name: API integration suite, with its coverage gate
        run: pnpm --filter @mindforge/api test:integration:coverage

      # New in M3, and it closes a gap `apps/worker/vitest.config.ts` had been describing as one:
      # the worker's `infrastructure/` layer is excluded from unit coverage on the grounds that
      # adapters are proved by running them, and until now nothing ran them. The Storage adapter is
      # the first place that mattered — `list()` is not recursive, and neither `download()` nor
      # `upload()` returns an ETag, so a double written to agree with the client's shape would have
      # been wrong in three places at once.
      - name: Worker integration suite, with its coverage gate
        run: pnpm --filter @mindforge/worker test:integration:coverage

      # Chromium only. A second engine doubles the slowest gate in the pipeline to catch rendering
      # differences this suite does not assert on — see playwright.config.ts.
      - name: Install Chromium
        run: pnpm --filter @mindforge/web exec playwright install --with-deps chromium

      # The E2E level (§13.2). It ran nowhere for the whole of M1 — no config, no specs — while the web
      # coverage config excluded the auth front door on the grounds that this covered it.
      #
      # Playwright starts the API and web dev servers itself; `reuseExistingServer` is off under CI, so a
      # stale process cannot silently serve the previous commit.
      - name: End-to-end suite
        run: pnpm --filter @mindforge/web test:e2e

      # Only on failure, and only the trace — a green run uploads nothing.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
